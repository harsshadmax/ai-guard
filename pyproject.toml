[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shadowrun"
version = "0.2.0"
description = "Live security guard for AI assistants and their tools (plus a package-install deep scan)"
requires-python = ">=3.10"
dependencies = [
  "fastapi", "uvicorn", "pydantic>=2", "docker", "pyyaml", "jinja2",
  "httpx", "packaging","pypiserver", "build", "setuptools", "wheel", "pytest",
]

[project.optional-dependencies]
llm = ["anthropic"]

[project.scripts]
shadowrun = "shadowrun.cli:main"
shadowguard = "guard.cli:main"

[tool.setuptools.packages.find]
include = ["shadowrun*", "guard*", "agent*", "eval*", "eval_guard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
